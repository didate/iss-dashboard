services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/iss}
    volumes:
      - iss-data:/data
    env_file: .env
    restart: unless-stopped
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      # One router serves both the UI (/iss) and the API (/iss/api).
      - "traefik.http.routers.iss.rule=Host(`apps.sante.gov.gn`) && PathPrefix(`/iss`)"
      - "traefik.http.routers.iss.entrypoints=didate_secure"
      - "traefik.http.routers.iss.tls.certresolver=didate"
      - "traefik.http.services.iss.loadbalancer.server.port=8080"
    networks:
      - traefik-netw

volumes:
  iss-data:

networks:
  traefik-netw:
    external: true
