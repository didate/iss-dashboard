<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="560" fill="#f8fafc"/>
  <text x="550" y="46" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">ISS Dashboard — How the data flows</text>
  <text x="550" y="74" text-anchor="middle" font-size="15" fill="#64748b">Everything is calculated once in the backend. The web app only displays.</text>

  <!-- DHIS2 -->
  <rect x="40" y="150" width="180" height="150" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#3730a3">DHIS2</text>
  <text x="130" y="226" text-anchor="middle" font-size="13" fill="#4338ca">ISS survey program</text>
  <text x="130" y="248" text-anchor="middle" font-size="13" fill="#4338ca">Health facilities</text>
  <text x="130" y="270" text-anchor="middle" font-size="13" fill="#4338ca">(1 event = 1 facility)</text>

  <!-- Backend big box -->
  <rect x="290" y="110" width="470" height="230" rx="14" fill="#ffffff" stroke="#0ea5e9" stroke-width="2.5"/>
  <text x="525" y="138" text-anchor="middle" font-size="16" font-weight="700" fill="#0369a1">BACKEND  (Go)  —  runs on a schedule or on demand</text>

  <!-- pipeline steps -->
  <rect x="310" y="160" width="95" height="70" rx="9" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="357" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#075985">Pull</text>
  <text x="357" y="212" text-anchor="middle" font-size="11" fill="#0c4a6e">from DHIS2</text>

  <rect x="418" y="160" width="95" height="70" rx="9" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="465" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#075985">Parse</text>
  <text x="465" y="212" text-anchor="middle" font-size="11" fill="#0c4a6e">read values</text>

  <rect x="526" y="160" width="95" height="70" rx="9" fill="#fef9c3" stroke="#eab308" stroke-width="1.8"/>
  <text x="573" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">Quality</text>
  <text x="573" y="206" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">rules</text>
  <text x="573" y="224" text-anchor="middle" font-size="10.5" fill="#713f12">find problems</text>

  <rect x="634" y="160" width="106" height="70" rx="9" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.6"/>
  <text x="687" y="188" text-anchor="middle" font-size="14" font-weight="600" fill="#075985">Aggregate</text>
  <text x="687" y="208" text-anchor="middle" font-size="11" fill="#0c4a6e">score + totals</text>

  <!-- arrows between steps -->
  <line x1="405" y1="195" x2="416" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="513" y1="195" x2="524" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="621" y1="195" x2="632" y2="195" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- SQLite -->
  <rect x="310" y="262" width="430" height="58" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="525" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#166534">SQLite database</text>
  <text x="525" y="308" text-anchor="middle" font-size="12" fill="#15803d">stores the ready-to-read results (quality issues, scores, summaries)</text>

  <!-- API -->
  <rect x="828" y="120" width="150" height="90" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="903" y="158" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">REST API</text>
  <text x="903" y="180" text-anchor="middle" font-size="12" fill="#475569">JSON, already</text>
  <text x="903" y="197" text-anchor="middle" font-size="12" fill="#475569">calculated</text>

  <!-- Frontend -->
  <rect x="828" y="240" width="150" height="100" rx="12" fill="#ffe4e6" stroke="#f43f5e" stroke-width="2"/>
  <text x="903" y="280" text-anchor="middle" font-size="15" font-weight="700" fill="#9f1239">Web dashboard</text>
  <text x="903" y="302" text-anchor="middle" font-size="12" fill="#be123c">React — display</text>
  <text x="903" y="319" text-anchor="middle" font-size="12" fill="#be123c">only, always fast</text>

  <!-- main arrows -->
  <line x1="222" y1="225" x2="286" y2="225" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="762" y1="200" x2="824" y2="168" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="903" y1="212" x2="903" y2="236" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- triggers -->
  <rect x="310" y="400" width="200" height="56" rx="9" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="410" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Scheduler (every 1h)</text>
  <text x="410" y="444" text-anchor="middle" font-size="11" fill="#c2410c">automatic refresh</text>

  <rect x="540" y="400" width="200" height="56" rx="9" fill="#fff7ed" stroke="#fb923c" stroke-width="1.8"/>
  <text x="640" y="425" text-anchor="middle" font-size="13" font-weight="600" fill="#9a3412">Admin button</text>
  <text x="640" y="444" text-anchor="middle" font-size="11" fill="#c2410c">&#171; Sync now &#187;</text>

  <line x1="410" y1="398" x2="410" y2="344" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <line x1="640" y1="398" x2="600" y2="344" stroke="#fb923c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="525" y="482" text-anchor="middle" font-size="12" fill="#94a3b8">Both use the same pipeline (one shared "RunSync" function)</text>
</svg>
